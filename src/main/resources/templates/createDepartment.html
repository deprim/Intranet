<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5">
    <div class="row">
        <div class="col-lg-10 offset-lg-1">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title mb-0">Department Management</h1>
            </div>

            <div th:if="${message}"
                 th:class="|alert alert-dismissible fade show ${alertClass ?: 'alert-success'}|"
                 role="alert">
                <span th:text="${message}">Action completed successfully.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row g-4">
                <div class="col-12">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-sitemap me-2"></i> Create New Department</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/department/create}" th:object="${newDepartment}" method="post">

                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label for="departmentTitle" class="form-label">Department Title</label>
                                        <input type="text" class="form-control" id="departmentTitle" th:field="*{title}" required>
                                    </div>
                                </div>

                                <div class="mt-4 text-end">
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-plus me-2"></i> Save Department
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-light">
                            <h5 class="mb-0"><i class="fas fa-list-alt me-2"></i> Existing Departments</h5>
                        </div>

                        <div th:if="${#lists.isEmpty(departments)}" class="card-body text-center p-4">
                            <i class="fas fa-building text-muted display-4 mb-3"></i>
                            <p class="text-muted mb-0">No departments to manage yet.</p>
                        </div>

                        <ul th:unless="${#lists.isEmpty(departments)}" class="list-group list-group-flush">
                            <li th:each="department : ${departments}" class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${department.title}">Department Name</strong>
                                    <br>
                                    <small class="text-muted">
                                        <i class="fas fa-users me-1"></i>
                                        Employees: <span th:text="${userCounts.get(department.id)} ?: 0">0</span>
                                    </small>
                                </div>

                                <form th:action="@{/department/delete/{id}(id=${department.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Are you sure you want to delete this department? This action cannot be undone.')">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
