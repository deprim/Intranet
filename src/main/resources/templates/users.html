<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Employees</h1>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/user}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label for="search" class="form-label">Search</label>
                    <input type="text"
                           class="form-control"
                           id="search"
                           name="search"
                           th:value="${search}"
                           placeholder="Name, email, or username...">
                </div>

                <div class="col-md-3">
                    <label for="departmentId" class="form-label">Department</label>
                    <select class="form-select" id="departmentId" name="departmentId">
                        <option value="">All Departments</option>

                        <option th:each="dept : ${allDepartments}"
                                th:value="${dept.id}"                    th:text="${dept.title}"                 th:selected="${selectedDepartmentId != null and dept.id == selectedDepartmentId}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label for="sortBy" class="form-label">Sort By</label>
                    <select class="form-select" id="sortBy" name="sortBy">
                        <option value="fullName" th:selected="${sortBy == 'fullName'}">Name</option>
                        <option value="department" th:selected="${sortBy == 'department'}">Department</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label>
                    <div class="form-check pt-1">
                        <input class="form-check-input"
                               type="checkbox"
                               id="showInactive"
                               name="showInactive"
                               value="true"
                               th:checked="${showInactive}">
                        <label class="form-check-label" for="showInactive">
                            Show Inactive
                        </label>
                    </div>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        Apply Filters
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h3 class="h2 mb-0 text-primary" th:text="${totalUsers}">0</h3>
                    <p class="text-muted mb-0">Total Employees</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h3 class="h2 mb-0 text-success" th:text="${activeUsers}">0</h3>
                    <p class="text-muted mb-0">Active</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h3 class="h2 mb-0 text-warning" th:text="${inactiveUsers}">0</h3>
                    <p class="text-muted mb-0">Inactive</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h3 class="h2 mb-0 text-info" th:text="${departmentCount}">0</h3>
                    <p class="text-muted mb-0">Departments</p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="alert alert-info">
        <h5 class="alert-heading">No employees found</h5>
        <p class="mb-0">Try adjusting your search or filter criteria.</p>
    </div>

    <div th:if="${!#lists.isEmpty(users)}" class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Position</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td>
                            <div class="d-flex align-items-center">

                                <th:block th:if="${user.avatarUrl != null and user.avatarUrl != ''}">
                                    <img th:src="${user.avatarUrl}" alt="Avatar" class="employee-avatar me-3">
                                </th:block>
                                <th:block th:unless="${user.avatarUrl != null and user.avatarUrl != ''}">
                                    <div class="employee-avatar me-3"
                                         th:with="initials=${user.fullName != null ?
                                                      #strings.substring(user.fullName, 0, 1) +
                                                      (#strings.contains(user.fullName, ' ') ?
                                                          #strings.substring(user.fullName, #strings.indexOf(user.fullName, ' ') + 1, #strings.indexOf(user.fullName, ' ') + 2)
                                                          : '')
                                                      : ''}"
                                         th:text="${initials}">
                                        JD
                                    </div>
                                </th:block>
                                <div>
                                    <div class="fw-semibold" th:text="${user.fullName}">John Doe</div>
                                    <small class="text-muted" th:text="'@' + ${user.username}">@johndoe</small>
                                </div>
                            </div>
                        </td>
                        <td th:text="${user.email}">john.doe@company.com</td>

                        <td>
                            <span class="badge bg-primary-soft"
                                  th:text="${user.department != null ? user.department.title : '-'}">Development</span>
                        </td>

                        <td th:text="${user.position ?: '-'}">Senior Developer</td>
                        <td>
                            <span th:if="${user.isActive}" class="badge bg-success">Active</span>
                            <span th:unless="${user.isActive}" class="badge bg-warning">Inactive</span>
                        </td>
                        <td>
                            <a th:href="@{/user/{id}(id=${user.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                View
                            </a>
                            <a th:href="@{/user/edit/{id}(id=${user.id})}"
                               class="btn btn-sm btn-outline-secondary"
                               sec:authorize="hasRole('ADMIN')">
                                Edit
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/users(page=${currentPage - 1}, search=${search}, departmentId=${selectedDepartmentId}, sortBy=${sortBy}, showInactive=${showInactive})}">&laquo;</a>
                    </li>

                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        class="page-item"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/users(page=${i}, search=${search}, departmentId=${selectedDepartmentId}, sortBy=${sortBy}, showInactive=${showInactive})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/users(page=${currentPage + 1}, search=${search}, departmentId=${selectedDepartmentId}, sortBy=${sortBy}, showInactive=${showInactive})}">&raquo;</a>
                    </li>
                </ul>
            </nav>


        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
