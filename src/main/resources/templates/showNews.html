<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <!-- Back to News Link -->
            <div class="mb-4">
                <a th:href="@{/news}" class="btn btn-outline-secondary btn-sm">&laquo; Back to News</a>
            </div>

            <!-- News Card -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h1 class="h3 mb-0" th:text="${news.title}">News Title</h1>
                        <span class="badge bg-primary" th:text="${news.publishedDate}">Oct 25, 2025</span>
                    </div>

                    <p class="text-muted mb-3" th:if="${news.author}">
                        Author: <span th:text="${news.author.fullName}">John Doe</span>
                    </p>

                    <div th:utext="${news.content}">
                        <!-- Full content of the news (can contain HTML formatting) -->
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                        Curabitur et diam nec libero sodales pharetra.
                    </div>

                    <!-- Optional: Related news or links -->
                    <div class="mt-4">
                        <a th:href="@{/news}" class="btn btn-outline-primary btn-sm">Back to News List</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
