<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5">
    <div class="row">
        <div class="col-lg-10 offset-lg-1">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title mb-0">Calendar Event Management</h1>
                <a th:href="@{/event/create}" class="btn btn-outline-primary">
                    <i class="fas fa-calendar-alt me-2"></i> View Calendar
                </a>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}">Action completed successfully.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row g-4">
                <div class="col-12">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i> Create New Event</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/event/create}" th:object="${newEvent}" method="post">

                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <label for="eventTitle" class="form-label">Event Title</label>
                                        <input type="text" class="form-control" id="eventTitle" th:field="*{title}" required>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="eventDate" class="form-label">Date</label>
                                        <input type="date" class="form-control" id="eventDate" th:field="*{date}" required>
                                    </div>
                                </div>

                                <div class="mt-4 text-end">
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-calendar-plus me-2"></i> Save Event
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-light">
                            <h5 class="mb-0"><i class="fas fa-list-alt me-2"></i> Existing Events</h5>
                        </div>

                        <div th:if="${#lists.isEmpty(events)}" class="card-body text-center p-4">
                            <i class="fas fa-calendar-times text-muted display-4 mb-3"></i>
                            <p class="text-muted mb-0">No events to manage yet.</p>
                        </div>

                        <ul th:unless="${#lists.isEmpty(events)}" class="list-group list-group-flush">
                            <li th:each="event : ${events}" class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${event.title}">Annual Shareholder Meeting</strong>
                                    <br>
                                    <small class="text-muted">
                                        <i class="far fa-calendar-alt me-1"></i>
                                        <span th:text="${#temporals.format(event.date, 'MMMM dd, yyyy')}">December 01, 2025</span>
                                    </small>
                                </div>

                                <form th:action="@{/event/delete/{id}(id=${event.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Are you sure you want to delete this event?')">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
