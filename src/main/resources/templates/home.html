<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-fill">
    <div class="container mt-5">
        <div class="row">

            <div class="col-lg-2 d-none d-lg-block">

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white fw-bold">Quick Links</div>
                    <div class="list-group list-group-flush">
                        <a href="/portal/hr" class="list-group-item list-group-item-action d-flex align-items-center">
                            <i class="fas fa-users fa-fw me-2"></i> HR Portal
                        </a>
                        <a href="/portal/it" class="list-group-item list-group-item-action d-flex align-items-center">
                            <i class="fas fa-tools fa-fw me-2"></i> IT Helpdesk
                        </a>
                        <a href="/portal/knowledge" class="list-group-item list-group-item-action d-flex align-items-center">
                            <i class="fas fa-book fa-fw me-2"></i> Knowledge Base
                        </a>
                        <a href="/portal/expenses" class="list-group-item list-group-item-action d-flex align-items-center">
                            <i class="fas fa-file-invoice-dollar fa-fw me-2"></i> Expense Reporting
                        </a>
                        <a href="/portal/calendar" class="list-group-item list-group-item-action d-flex align-items-center">
                            <i class="fas fa-calendar-alt fa-fw me-2"></i> Company Calendar
                        </a>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-secondary text-white text-center fw-bold" id="calendar-header">
                        Loading Calendar...
                    </div>
                    <div class="card-body p-2">
                        <div class="calendar-grid" id="calendar-grid">
                        </div>
                        <small class="text-muted d-block text-center mt-2">Click to view all company events</small>
                    </div>
                </div>

            </div>

            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Latest News</div>
                    <div class="card-body">
                        <div th:each="newsItem : ${news}" class="news-item mb-3">
                            <h5 th:text="${newsItem.title}">News Title</h5>
                            <p class="news-content-text" th:attrappend="data-news-id=${newsItem.id}" th:text="${newsItem.content}"></p>
                            <hr>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">

                <div class="card shadow-sm mb-4 birthday-card" style="border: none;">
                    <div class="card-header bg-primary text-white">
                        Birthdays in <span th:text="${month}">Month</span>
                    </div>
                    <div class="card-body d-flex flex-column gap-2 p-2">
                        <div th:each="user : ${monthBirthday}" class="d-flex justify-content-between align-items-center p-2 bg-light rounded shadow-sm">
                            <span th:text="${user.fullName}">Full Name</span>
                            <span th:text="${user.getDateOfBirth().getDayOfMonth()}">Day</span>
                        </div>
                    </div>
                </div>


                <div class="card shadow-sm mb-4 birthday-card" style="border: none;">
                    <div class="card-header bg-primary text-white">Birthdays Today</div>

                    <div th:if="${#lists.isEmpty(monthToday)}" class="card-body text-center p-3">
                        <i class="fas fa-gift text-muted birthday-icon-medium mb-2"></i>
                        <p class="text-muted mb-0">No birthdays today. Check back tomorrow!</p>
                    </div>

                    <div th:unless="${#lists.isEmpty(monthToday)}" class="card-body d-flex flex-wrap gap-2 p-2">
                        <div th:each="user : ${monthToday}"
                             class="p-2 bg-light border rounded shadow-sm"
                             th:text="${user.fullName}">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // =========================================================================
    // ЭТОТ БЛОК НУЖНО ЗАМЕНИТЬ НА РЕАЛЬНУЮ ИНЖЕКЦИЮ ДАННЫХ ИЗ THYMELEAF/SPRING
    // Пример: const eventsJson = /*[[${eventsJson}]]*/ '[]';
    // JSON должен содержать объекты с полями "date" (YYYY-MM-DD) и "title".
    const eventsJson = '[{"date": "2025-10-29", "title": "Team Meeting"}, {"date": "2025-11-05", "title": "Company Holiday"}, {"date": "2025-10-17", "title": "Training"}]';
    // =========================================================================

    document.addEventListener('DOMContentLoaded', (event) => {
        // --- Calendar Logic (kept for completeness) ---

        function renderCalendar() {
            const date = new Date();
            const year = date.getFullYear();
            const month = date.getMonth(); // 0-11
            const today = date.getDate();

            let events = {};
            try {
                const allEvents = JSON.parse(eventsJson);
                const currentMonthKey = `${year}-${String(month + 1).padStart(2, '0')}`;

                allEvents
                    .filter(e => e.date.startsWith(currentMonthKey))
                    .forEach(event => {
                        const eventDate = new Date(event.date);
                        if (eventDate.getFullYear() === year && eventDate.getMonth() === month) {
                            const day = eventDate.getDate();
                            events[day] = event;
                        }
                    });

            } catch (e) {
                console.error("Failed to parse events JSON. Check Thymeleaf data injection:", e);
            }

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            // Day headers are shortened in the HTML, so we use single letters for consistency
            const dayHeaders = ["S", "M", "T", "W", "T", "F", "S"];

            const headerElement = document.getElementById('calendar-header');
            const gridElement = document.getElementById('calendar-grid');

            headerElement.textContent = `${monthNames[month]} ${year}`;

            let htmlContent = '';
            dayHeaders.forEach(day => {
                htmlContent += `<div class="day-header">${day}</div>`;
            });

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayOfMonth; i++) {
                htmlContent += `<div class="day-cell"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                let dayClass = 'day-cell';
                let eventTitle = '';
                const isCurrentDay = (day === today);
                const hasEvent = events[day];

                if (hasEvent) {
                    dayClass += ' event-day';
                    eventTitle = ` title="${hasEvent.title}"`;
                }

                if (isCurrentDay) {
                    dayClass += ' current-day';
                }

                htmlContent += `<div class="${dayClass}"${eventTitle}>${day}</div>`;
            }

            gridElement.innerHTML = htmlContent;
        }

        // --- News Truncation Logic (UPDATED) ---

        // Truncates text and adds a 'Read More' button linked to the news ID
        function setupNewsTruncation(limit = 150) {
            const newsElements = document.querySelectorAll('.news-content-text');

            newsElements.forEach(p => {
                const fullText = p.textContent;
                // Trim content injected by Thymeleaf
                p.textContent = fullText.trim();

                // Get news ID from the data attribute (which must be set by Thymeleaf)
                const newsId = p.getAttribute('data-news-id');

                // Check if truncation is necessary AND if we have a news ID for navigation
                if (fullText.length > limit && newsId) {
                    // Set the initial content to truncated preview
                    p.textContent = fullText.substring(0, limit).trim() + '...';

                    // Create Read More button
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-sm btn-outline-primary read-more-btn mt-2';
                    btn.textContent = 'Read More'; // <-- Текст кнопки на английском

                    // Append button right after the paragraph
                    p.parentNode.insertBefore(btn, p.nextSibling);

                    // Add click listener for navigation
                    btn.addEventListener('click', function() {
                        // Navigate to the specific news endpoint using the ID
                        window.location.href = `/news/${newsId}`;
                    });
                }
            });
        }

        renderCalendar();
        setupNewsTruncation(150); // Устанавливаем лимит 150 символов
    });
</script>
</body>
</html>
