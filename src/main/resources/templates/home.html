<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Home</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Твой кастомный CSS -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-fill">
<div class="container mt-5">
  <div class="row">

    <!-- Левая колонка (опционально можно добавить боковое меню) -->
    <div class="col-lg-2 d-none d-lg-block">
      <!-- Sidebar (empty for now) -->
    </div>

    <!-- Центральная колонка — Новости -->
    <div class="col-lg-6 mb-4">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">Latest News</div>
        <div class="card-body">
          <div th:each="newsItem : ${news}" class="news-item mb-3">
            <h5 th:text="${newsItem.title}"></h5>
            <p th:text="${newsItem.content}"></p>
            <hr>
          </div>
        </div>
      </div>
    </div>

    <!-- Правая колонка — Таблицы с днями рождения -->
    <div class="col-lg-4">

      <!-- Birthday This Month -->
      <div class="card shadow-sm mb-4 birthday-card" style="border: none;">
        <div class="card-header bg-primary text-white">
          Birthdays in <span th:text="${month}">Month</span>
        </div>
        <div class="card-body d-flex flex-column gap-2 p-2">
          <div th:each="user : ${monthBirthday}" class="d-flex justify-content-between align-items-center p-2 bg-light rounded shadow-sm">
            <span th:text="${user.fullName}">Full Name</span>
            <span th:text="${user.getDateOfBirth().getDayOfMonth()}">Day</span>
          </div>
        </div>
      </div>



      <!-- Birthday Today -->
      <div class="card shadow-sm mb-4 birthday-card" style="border: none;">
        <div class="card-header bg-primary text-white">Birthdays Today!</div>
        <div class="card-body d-flex flex-wrap gap-2">
          <div th:each="user : ${monthToday}"
               class="p-2 bg-light border rounded shadow-sm"
               th:text="${user.fullName}">
          </div>
        </div>
      </div>



    </div>

  </div>
</div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
