<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">

            <!-- Заголовок страницы -->
            <div class="card shadow-sm mb-4 p-3 border-start border-5 border-danger">
                <h1 class="h4 m-0 text-danger fw-bold">Create New News Post</h1>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">

                    <!-- Форма создания новости -->
                    <form th:action="@{/news/create}" method="post">

                        <!-- Заголовок новости -->
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Title</label>
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   name="title"
                                   placeholder="Enter the news title (max 255 chars)"
                                   maxlength="255"
                                   required>
                        </div>

                        <!-- Содержание новости -->
                        <div class="mb-3">
                            <label for="content" class="form-label fw-bold">Content</label>
                            <textarea class="form-control"
                                      id="content"
                                      name="content"
                                      rows="15"
                                      placeholder="Write the full news content here..."
                                      required></textarea>
                        </div>

                        <!-- Кнопки управления -->
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <!-- Кнопка для отмены или возврата -->
                            <a th:href="@{/news}" class="btn btn-outline-secondary">Cancel</a>

                            <!-- Кнопка отправки формы -->
                            <button type="submit" class="btn btn-primary">Publish News</button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
