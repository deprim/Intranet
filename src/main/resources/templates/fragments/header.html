<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Corporate Portal'">Corporate Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<header th:fragment="header" class="site-header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/home}">
                <img th:src="@{/images/logo.png}" alt="Logo" class="logo-img me-2"
                     onerror="this.style.display='none'">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/home}"
                           th:classappend="${#strings.equals(activePage, 'home')} ? ' active' : ''">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/news}"
                           th:classappend="${#strings.equals(activePage, 'news')} ? ' active' : ''">
                            News
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user}"
                           th:classappend="${#strings.equals(activePage, 'user')} ? ' active' : ''">
                            Employees
                        </a>
                    </li>

                    <!-- NEW: Events/Calendar Management Link -->
                    <!-- Предполагаем, что этот пункт меню доступен только администраторам или HR -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'HR')">
                        <a class="nav-link" th:href="@{/event/create}"
                           th:classappend="${#strings.equals(activePage, 'event')} ? ' active' : ''">
                            Events
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link " th:href="@{/news/create}"
                           th:classappend="${#strings.equals(activePage, 'create-news')} ? ' active' : ''">
                            Create news
                        </a>
                    </li>


                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/register}">
                            Register User
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}">
                            My Profile
                        </a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <form th:action="@{/profile/toggle-ooo}" method="post">
                            <button type="submit"
                                    class="btn btn-sm"
                                    th:classappend="${isOOO} ? 'btn-success' : 'btn-outline-secondary'">
                            <span th:if="${isOOO}">
                                🟢 OOO (Click to return)
                            </span>
                                <span th:unless="${isOOO}">
                                Set Out Of Office
                            </span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</header>
</body>
</html>
