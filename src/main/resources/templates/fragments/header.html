<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Corporate Portal'">Corporate Portal</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<header th:fragment="header" class="site-header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/home}">
                <img th:src="@{/images/logo.webp}" alt="Logo" class="logo-img me-2"
                     onerror="this.style.display='none'">
                <!-- <span class="brand-text">Walletto Intranet</span> -->
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/home}"
                           th:classappend="${#strings.equals(activePage, 'home')} ? ' active' : ''">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/news}"
                           th:classappend="${#strings.equals(activePage, 'news')} ? ' active' : ''">
                            News
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/birthdays}"
                           th:classappend="${#strings.equals(activePage, 'birthdays')} ? ' active' : ''">
                            Birthdays
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user}"
                           th:classappend="${#strings.equals(activePage, 'user')} ? ' active' : ''">
                            Employees
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')" th:href="@{/register}">
                        <a class="nav-link btn btn-success ms-2" th:href="@{/register}">
                            Register User
                        </a>
                    </li>

                    <!-- Кнопка Мой профиль, если пользователь залогинен -->
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-primary ms-2" th:href="@{/profile}">
                            My Profile
                        </a>
                    </li>

                </ul>


            </div>
        </div>
    </nav>
</header>
</body>
</html>
